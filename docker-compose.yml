version: '3.8'

services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ollama_desktop_chatbot
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - OLLAMA_URL=http://host.docker.internal:11434
    volumes:
      - ./data:/app/data
      - ./OutWrite Documents:/app/OutWrite Documents
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Optional bundled Ollama service if you don't run Ollama natively on host
  # To run with bundled ollama: docker compose --profile with-ollama up
  ollama:
    image: ollama/ollama:latest
    container_name: ollama_bundled
    profiles: ["with-ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
